spring.application.name=furhope-user
app.default_country_code=+216
app.sms.mode=AUTO
ai.replies.mode=DRAFT_ONLY
ai.replies.system_admin_id=
ai.replies.provider=OPENAI_COMPAT
ai.replies.api_url=https://api.openai.com/v1/chat/completions
ai.replies.model=gpt-4o-mini
ai.replies.api_key=
ai.replies.min_confidence=0.70
google.oauth.client_id=
google.oauth.client_secret=
google.oauth.redirect_uri=http://localhost:8765/oauth2/callback

# AI replies modes:
# OFF            -> no auto-reply logic
# DRAFT_ONLY     -> generate draft text only (recommended first step)
# SAFE_AUTO_SEND -> auto-send only low-risk intents using a dedicated system admin user
#
# Optional local overrides:
# - create ai.secrets.properties in project root
# - or set env vars:
#   AI_REPLIES_MODE, AI_REPLIES_SYSTEM_ADMIN_ID, AI_REPLIES_PROVIDER,
#   AI_REPLIES_API_URL, AI_REPLIES_MODEL, AI_REPLIES_API_KEY (or OPENAI_API_KEY),
#   AI_REPLIES_MIN_CONFIDENCE
#
# Google OAuth login:
# - set GOOGLE_OAUTH_CLIENT_ID and GOOGLE_OAUTH_CLIENT_SECRET
# - optional GOOGLE_OAUTH_REDIRECT_URI (default http://localhost:8765/oauth2/callback)

# Optional Twilio config:
# Recommended: set env vars (TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM_NUMBER)
# Local dev option: create `twilio.secrets.properties` in the project root (see `twilio.secrets.properties.example`)
# twilio.account_sid=ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# twilio.auth_token=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# twilio.from_number=+12525958024

# Optional Brevo email API config:
# Recommended: set env vars (BREVO_API_KEY, MAIL_FROM_ADDRESS, MAIL_FROM_NAME)
# Local dev option: create `mail.secrets.properties` in project root (see `mail.secrets.properties.example`)
# mail.brevo.api_key=xkeysib-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# mail.from_address=no-reply@yourdomain.com
# mail.from_name=FurHope
